name: Autonomous Web Intelligence & Lead Engine

on:
  # Cron disabled for now. Uncomment to re-enable 12h automatic runs:
  # schedule:
  #   - cron: '0 0,12 * * *'
  # Allows you to trigger the workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install playwright browsers for scrapling
          playwright install chromium

      # leads.db is git-ignored (no lead data in the repo), so state lives in
      # Cloudflare R2. These steps are skipped when R2 secrets are not set.
      - name: Pull Leads Database from R2
        if: env.R2_ACCOUNT_ID != ''
        run: python sync_r2.py pull

      - name: Run Autonomous Pipeline
        env:
          # Pulling secrets from GitHub Repository Secrets
          ACTIVE_PROFILE: gtm_devrel
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          YOUR_ONE_LINER: ${{ secrets.YOUR_ONE_LINER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Apollo enrichment - Tier 1a: session cookie (10,000 reveals/year free)
          # Get from: app.apollo.io -> DevTools -> Application -> Cookies -> _apollo_session
          APOLLO_COOKIE: ${{ secrets.APOLLO_COOKIE }}
          # Apollo enrichment - Tier 1b: REST API key (60 credits/month free)
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          python main.py

      - name: Push Leads Database to R2
        if: env.R2_ACCOUNT_ID != ''
        run: python sync_r2.py push
